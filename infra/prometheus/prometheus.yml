# Dev-only scrape config. `apps/api` runs on the HOST via `pnpm dev`, not as
# a docker-compose service — `host.docker.internal` is Docker Desktop's
# well-known hostname for reaching the host machine from inside a container
# (works on Windows/Mac; on native Linux Docker you'd need
# `--add-host=host.docker.internal:host-gateway` or the gateway IP instead —
# not needed here since this whole repo targets Windows dev).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "api"
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:3001"]
